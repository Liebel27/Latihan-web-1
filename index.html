<!DOCTYPE html>
<html>
    <head>
        <title>Layout HTML</title>
    </head>
    <body>
     <table border="1" style="border-collapse: collapse; width: 600px;">

     <tr>
    <th colspan="2" style="height: 70px; background-color: bisque; border: 1px solid orange;">

 <tr>

  </th>
     </tr>
    
  <tr>

        <section> 
            <h1> 
                Heading 1
            </h1>
            <p style="width: 300px;">
            Lorem ipsum dolor sit amet, consectetur  
             adipiscing elit, sed do eiusmod tempor   
             incididunt ut labore et dolore magna aliqua. 
            </p>
        </section>
    </td>
    <td style="height: 100px; background-color: #d5e8d4 ; border: 1px solid #70c770;">Menu:
        <ul>
        <li>Home</li>
        <li>Berita</li>
        <li>Layanan</li>
        <li>kontak</li>
        </ul>
    </td>
  </tr>

 <tr>
    <th colspan="2" style="height: 50px; background-color: bisque ; border: 1px solid orange;">
        FOOTER
        
  </th>
     </tr>

     </table>

</html>
